# Render Blueprint: static site built from main.
# Render reads the Node version from .node-version.
services:
  - type: web
    runtime: static
    name: postdata
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deploy only once the GitHub checks (.github/workflows/ci.yml) pass.
    autoDeployTrigger: checksPass
    headers:
      # Astro fingerprints everything under /_astro/ (scripts, styles, fonts).
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
